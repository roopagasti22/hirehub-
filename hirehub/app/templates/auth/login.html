{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow border-0">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-briefcase-fill text-primary" style="font-size:2.5rem;"></i>
            <h3 class="fw-bold mt-2">Welcome Back</h3>
            <p class="text-muted small">Sign in to your HireHub account</p>
          </div>

          <form method="POST" action="{{ url_for('web.auth.login') }}" novalidate>
            <div class="mb-3">
              <label for="email" class="form-label fw-semibold">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" id="email" name="email" placeholder="you@example.com" required autofocus />
              </div>
            </div>
            <div class="mb-4">
              <label for="password" class="form-label fw-semibold">Password</label>
              <div class="input-group">
                <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" id="password" name="password" placeholder="••••••••" required />
                <button class="btn btn-outline-secondary" type="button" id="togglePwd">
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">
              <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
            </button>
          </form>

          <hr class="my-4" />
          <p class="text-center mb-0">
            Don't have an account?
            <a href="{{ url_for('web.auth.register') }}" class="fw-semibold">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
document.getElementById('togglePwd').addEventListener('click', function() {
  const pwd = document.getElementById('password');
  const icon = this.querySelector('i');
  if (pwd.type === 'password') {
    pwd.type = 'text';
    icon.classList.replace('bi-eye', 'bi-eye-slash');
  } else {
    pwd.type = 'password';
    icon.classList.replace('bi-eye-slash', 'bi-eye');
  }
});
</script>
{% endblock %}

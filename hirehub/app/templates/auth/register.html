{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-7">
      <div class="card shadow border-0">
        <div class="card-body p-4">
          <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill text-primary" style="font-size:2.5rem;"></i>
            <h3 class="fw-bold mt-2">Create Your Account</h3>
          </div>

          <!-- Role Tabs -->
          <ul class="nav nav-pills mb-4 justify-content-center" id="roleTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link {% if role != 'recruiter' %}active{% endif %}" id="candidate-tab"
                data-bs-toggle="pill" data-bs-target="#candidate-form" type="button">
                <i class="bi bi-person me-1"></i>Candidate
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link {% if role == 'recruiter' %}active{% endif %}" id="recruiter-tab"
                data-bs-toggle="pill" data-bs-target="#recruiter-form" type="button">
                <i class="bi bi-building me-1"></i>Recruiter
              </button>
            </li>
          </ul>

          <div class="tab-content">
            <!-- Candidate Form -->
            <div class="tab-pane fade {% if role != 'recruiter' %}show active{% endif %}" id="candidate-form">
              <form method="POST" action="{{ url_for('web.auth.register_candidate') }}" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" name="name" value="{{ form_data.get('name','') if form_data }}" placeholder="Jane Doe" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone</label>
                    <input type="tel" class="form-control" name="phone" value="{{ form_data.get('phone','') if form_data }}" placeholder="+91 9876543210" required />
                  </div>
                  <div class="col-12">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" name="email" value="{{ form_data.get('email','') if form_data }}" placeholder="you@example.com" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Min 8 chars, A-Z, 0-9" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control" name="confirm_password" placeholder="Repeat password" required />
                  </div>
                </div>
                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary fw-bold py-2">
                    <i class="bi bi-person-check me-1"></i>Create Candidate Account
                  </button>
                </div>
              </form>
            </div>

            <!-- Recruiter Form -->
            <div class="tab-pane fade {% if role == 'recruiter' %}show active{% endif %}" id="recruiter-form">
              <form method="POST" action="{{ url_for('web.auth.register_recruiter') }}" novalidate>
                <div class="row g-3">
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Full Name</label>
                    <input type="text" class="form-control" name="name" placeholder="John Smith" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Phone</label>
                    <input type="tel" class="form-control" name="phone" placeholder="+91 9876543210" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Email Address</label>
                    <input type="email" class="form-control" name="email" placeholder="recruiter@company.com" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Company Name</label>
                    <input type="text" class="form-control" name="company_name" placeholder="Acme Corp" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" class="form-control" name="password" placeholder="Min 8 chars, A-Z, 0-9" required />
                  </div>
                  <div class="col-md-6">
                    <label class="form-label fw-semibold">Confirm Password</label>
                    <input type="password" class="form-control" name="confirm_password" placeholder="Repeat password" required />
                  </div>
                </div>
                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-success fw-bold py-2">
                    <i class="bi bi-building-add me-1"></i>Create Recruiter Account
                  </button>
                </div>
              </form>
            </div>
          </div>

          <hr class="my-4" />
          <p class="text-center mb-0">
            Already have an account?
            <a href="{{ url_for('web.auth.login') }}" class="fw-semibold">Sign in</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}

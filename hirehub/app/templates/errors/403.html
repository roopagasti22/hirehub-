{% extends "base.html" %}
{% block title %}Access Denied{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-danger opacity-25">403</div>
    <h2 class="fw-bold mt-3">Access Denied</h2>
    <p class="text-muted lead">You don't have permission to access this resource.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">
      <i class="bi bi-house me-1"></i>Go Home
    </a>
  </div>
</div>
{% endblock %}

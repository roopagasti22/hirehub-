{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-primary opacity-25">404</div>
    <h2 class="fw-bold mt-3">Page Not Found</h2>
    <p class="text-muted lead">The page you're looking for doesn't exist or has been moved.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">
      <i class="bi bi-house me-1"></i>Go Home
    </a>
  </div>
</div>
{% endblock %}

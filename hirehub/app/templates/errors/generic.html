{% extends "base.html" %}
{% block title %}Error{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-secondary opacity-25">{{ error.status_code if error.status_code else 'Error' }}</div>
    <h2 class="fw-bold mt-3">Oops!</h2>
    <p class="text-muted lead">{{ error.message if error.message else 'An error occurred.' }}</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">
      <i class="bi bi-house me-1"></i>Go Home
    </a>
  </div>
</div>
{% endblock %}

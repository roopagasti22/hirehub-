{% extends "base.html" %}
{% block title %}Server Error{% endblock %}
{% block content %}
<div class="container py-5 text-center">
  <div class="py-5">
    <div class="display-1 fw-bold text-warning opacity-25">500</div>
    <h2 class="fw-bold mt-3">Something Went Wrong</h2>
    <p class="text-muted lead">An unexpected error occurred. Please try again later.</p>
    <a href="{{ url_for('home') }}" class="btn btn-primary mt-3">
      <i class="bi bi-house me-1"></i>Go Home
    </a>
  </div>
</div>
{% endblock %}

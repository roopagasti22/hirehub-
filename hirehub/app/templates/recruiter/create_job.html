{% extends "base.html" %}
{% block title %}Post a Job{% endblock %}

{% block content %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-lg-9">
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white fw-bold">
          <i class="bi bi-plus-circle me-1 text-success"></i>Post a New Job
        </div>
        <div class="card-body p-4">
          <form method="POST" action="{{ url_for('web.recruiter.create_job') }}">
            <div class="row g-3">
              <div class="col-12">
                <label class="form-label fw-semibold">Job Title <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="title" placeholder="e.g. Senior Python Developer" required />
              </div>
              <div class="col-12">
                <label class="form-label fw-semibold">Job Description</label>
                <textarea class="form-control" name="description" rows="5" placeholder="Describe the role, responsibilities, and requirements..."></textarea>
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Required Skills <span class="text-muted small">(comma-separated)</span></label>
                <input type="text" class="form-control" name="skills" placeholder="python, django, postgresql..." />
              </div>
              <div class="col-md-6">
                <label class="form-label fw-semibold">Location <span class="text-danger">*</span></label>
                <input type="text" class="form-control" name="location" placeholder="Bengaluru, India" required />
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Work Mode</label>
                <select class="form-select" name="work_mode">
                  {% for mode in ['ONSITE','REMOTE','HYBRID'] %}
                  <option value="{{ mode }}">{{ mode|title }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Employment Type</label>
                <select class="form-select" name="employment_type">
                  {% for et in ['FULL_TIME','PART_TIME','INTERNSHIP','CONTRACT'] %}
                  <option value="{{ et }}">{{ et|replace('_',' ')|title }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Application Deadline</label>
                <input type="date" class="form-control" name="deadline" />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Min Experience (yrs)</label>
                <input type="number" class="form-control" name="experience_min" value="0" min="0" />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Max Experience (yrs)</label>
                <input type="number" class="form-control" name="experience_max" value="5" min="0" />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Salary Min (₹)</label>
                <input type="number" class="form-control" name="salary_min" placeholder="300000" />
              </div>
              <div class="col-md-3">
                <label class="form-label fw-semibold">Salary Max (₹)</label>
                <input type="number" class="form-control" name="salary_max" placeholder="700000" />
              </div>
            </div>
            <div class="d-flex gap-2 mt-4">
              <button type="submit" class="btn btn-success fw-bold">
                <i class="bi bi-send me-1"></i>Post Job
              </button>
              <a href="{{ url_for('web.recruiter.my_jobs') }}" class="btn btn-outline-secondary">Cancel</a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
